<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | University Complaints</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="auth-layout">
      <section class="card auth-card">
        <a class="auth-brand brand" href="/"><span class="brand-mark"><i data-lucide="messages-square"></i></span><span>University Complaints</span></a>
        <span class="eyebrow">Account access</span>
        <h1>Welcome back</h1>
        <p class="auth-intro">Sign in to manage your complaints and review updates.</p>
        <div id="loginAlert" class="alert" hidden></div>
        <form id="loginForm" class="form-grid">
          <div class="form-row">
            <label for="email">Email</label
            ><input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-row">
            <label for="password">Password</label>
            <div class="password-field">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <button
                class="password-toggle"
                type="button"
                data-password-toggle
                aria-label="Show password"
                aria-pressed="false"
              >
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>
          <button id="loginButton" class="button" type="submit">
            <i data-lucide="log-in"></i><span>Log in</span>
          </button>
        </form>
        <p>New student? <a href="/register.html">Create an account</a></p>
        <p><a href="/">Return to homepage</a></p>
      </section>
    </main>
    <script src="/vendor/lucide/lucide.min.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/password-toggle.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>

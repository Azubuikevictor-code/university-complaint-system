<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complaint Management</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="container nav">
        <a class="brand" href="/admin/dashboard.html"
          ><span class="brand-mark"><i data-lucide="shield-check"></i></span
          >Administrator Portal</a
        ><button class="theme-button" type="button" data-theme-toggle>
          <i data-lucide="moon"></i><span data-theme-label>Dark mode</span>
        </button>
      </nav>
    </header>
    <div class="dashboard">
      <aside class="sidebar">
        <nav>
          <a href="/admin/dashboard.html"
            ><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a
          ><a class="active" href="/admin/complaints.html"
            ><i data-lucide="clipboard-list"></i><span>All Complaints</span></a
          ><a href="/admin/students.html"
            ><i data-lucide="users"></i><span>Students</span></a
          ><a href="#" data-logout
            ><i data-lucide="log-out"></i><span>Logout</span></a
          >
        </nav>
      </aside>
      <main class="dashboard-main">
        <div id="adminDetailAlert" class="alert" hidden></div>
        <section id="adminComplaintDetail" class="card">
          Loading complaint...
        </section>
        <section class="card" style="margin-top: 18px">
          <h2>Update Complaint</h2>
          <form id="adminComplaintForm" class="form-grid">
            <div class="form-row">
              <label for="updateStatus">Status</label
              ><select id="updateStatus" name="status">
                <option>Submitted</option>
                <option>Under Review</option>
                <option>In Progress</option>
                <option>Resolved</option>
                <option>Rejected</option>
              </select>
            </div>
            <div class="form-row">
              <label for="updatePriority">Priority</label
              ><select id="updatePriority" name="priority">
                <option>Low</option>
                <option>Normal</option>
                <option>High</option>
                <option>Urgent</option>
              </select>
            </div>
            <div class="form-row">
              <label for="adminResponse">Administrative response</label
              ><textarea
                id="adminResponse"
                name="response"
                maxlength="3000"
              ></textarea>
            </div>
            <button class="button" type="submit">Save Update</button>
          </form>
        </section>
      </main>
    </div>
    <script src="/vendor/lucide/lucide.min.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth-session.js"></script>
    <script src="/js/complaint-detail.js"></script>
  </body>
</html>

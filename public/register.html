<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration | University Complaints</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="auth-layout">
      <section class="card auth-card">
        <a class="auth-brand brand" href="/"><span class="brand-mark"><i data-lucide="messages-square"></i></span><span>University Complaints</span></a>
        <span class="eyebrow">Student registration</span>
        <h1>Create your account</h1>
        <p class="auth-intro">Register to submit complaints and track every update.</p>
        <div id="registerAlert" class="alert" hidden></div>
        <form id="registerForm" class="form-grid">
          <div class="form-row">
            <label for="fullName">Full name</label
            ><input id="fullName" name="fullName" minlength="3" required />
          </div>
          <div class="form-row">
            <label for="matriculationNumber">Matriculation number</label
            ><input
              id="matriculationNumber"
              name="matriculationNumber"
              required
            />
          </div>
          <div class="form-row">
            <label for="email">Email</label
            ><input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-row">
            <label for="faculty">Faculty</label
            ><select id="faculty" name="faculty" required>
              <option value="">Select a faculty</option>
            </select>
          </div>
          <div class="form-row">
            <label for="department">Department</label
            ><select id="department" name="department" required>
              <option value="">Select a department</option>
            </select>
          </div>
          <div class="form-row">
            <label for="password">Password</label>
            <div class="password-field">
              <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              />
              <button
                class="password-toggle"
                type="button"
                data-password-toggle
                aria-label="Show password"
                aria-pressed="false"
              >
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>
          <div class="form-row">
            <label for="confirmPassword">Confirm password</label>
            <div class="password-field">
              <input
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              />
              <button
                class="password-toggle"
                type="button"
                data-password-toggle
                aria-label="Show password"
                aria-pressed="false"
              >
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>
          <button id="registerButton" class="button" type="submit">
            <i data-lucide="user-plus"></i><span>Create account</span>
          </button>
        </form>
        <p>Already registered? <a href="/login.html">Log in</a></p>
      </section>
    </main>
    <script src="/vendor/lucide/lucide.min.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/password-toggle.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
